[project]
name = "graph-ml"
version = "0.1.0"
description = "Graph neural network (PyTorch) rework of the networkAnalysisForML trade-finance transaction-network project."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "torch-geometric>=2.6",
    "networkx>=3.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "lightgbm>=4.7.0",
    "plotly>=6.9.0",
    "pyvis>=0.3.2",
    "pyarrow>=25.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "jupyter>=1.1",
    "ruff>=0.6",
    "torchview>=0.2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_ml"]
